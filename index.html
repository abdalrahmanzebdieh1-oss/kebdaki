function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return JSON.parse(JSON.stringify(DEFAULT_DATA));
    const parsed = JSON.parse(raw);
    return {
      settings: {...DEFAULT_DATA.settings, ...(parsed.settings||{})},
      items: Array.isArray(parsed.items)&&parsed.items.length ? parsed.items : DEFAULT_DATA.items,
      addons: Array.isArray(parsed.addons) ? parsed.addons : DEFAULT_DATA.addons,
      zones: Array.isArray(parsed.zones) ? parsed.zones : DEFAULT_DATA.zones,
      coupons: Array.isArray(parsed.coupons) ? parsed.coupons : DEFAULT_DATA.coupons
    };
  }catch(e){return JSON.parse(JSON.stringify(DEFAULT_DATA));}
}

function sanitize(str){const d=document.createElement('div');d.textContent=String(str??'');return d.innerHTML;}

function formatDirectImageUrl(url){
  if(!url) return '';
  const m = String(url).match(/(?:drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?id=)|docs\.google\.com\/uc\?id=)([a-zA-Z0-9_-]+)/);
  return m ? `https://lh3.googleusercontent.com/d/${m[1]}` : url.trim();
}
function normalizeArabicInput(str){
  const map={'٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9','ش':'a','ؤ':'c','ي':'d','ث':'e','ب':'f','ل':'g','ا':'h','ه':'i','ت':'j','ن':'k','م':'l','ة':'m','ى':'n','خ':'o','ح':'p','ض':'q','ق':'r','س':'s','ف':'t','ع':'u','ر':'v','ص':'w','ء':'x','غ':'y','ئ':'z'};
  return String(str).split('').map(c=>map[c]||c).join('');
}
async function sha256(str){
  const buf = await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function isStoreOpen(){
  const [oh,om] = (state.settings.openTime||'12:00').split(':').map(Number);
  const [ch,cm] = (state.settings.closeTime||'04:00').split(':').map(Number);
  const now = new Date();
  const cur = now.getHours()*60 + now.getMinutes();
  const openM = oh*60 + om, closeM = ch*60 + cm;
  return closeM < openM ? (cur >= openM || cur <= closeM) : (cur >= openM && cur <= closeM);
}

window.pickSize = function(idx){
  window._selSize=idx;
  document.querySelectorAll('.sz-btn').forEach((b,i)=>{
    b.className = `sz-btn p-2.5 rounded-xl border text-xs font-bold transition ${i===idx?'border-[#d49a5a] bg-[#d49a5a]/15 text-[#f5f0e6]':'border-[#352e27] bg-[#121110] text-[#a89f91]'}`;
  });
  updateCustomTotal();
};
window.toggleAddon = function(id,chk){
  if(chk) window._selAddons.push(id); else window._selAddons=window._selAddons.filter(x=>x!==id);
  updateCustomTotal();
};
window.chgQty = function(d){window._qty=Math.max(1,window._qty+d);document.getElementById('customQty').textContent=window._qty;updateCustomTotal();};
function updateCustomTotal(){
  const it=window._curItem, sz=it.sizes[window._selSize];
  const addSum = window._selAddons.reduce((s,id)=>s+(state.addons.find(a=>a.id===id)?.price||0),0);
  document.getElementById('addBtnLabel').textContent = `أضف للسلة - ${(sz.p+addSum)*window._qty} ج.م`;
}
window.confirmAdd = function(){
  const it=window._curItem, sz=it.sizes[window._selSize];
  const chosenAddons = window._selAddons.map(id=>state.addons.find(a=>a.id===id)).filter(Boolean);
  const unitPrice = sz.p + chosenAddons.reduce((s,a)=>s+a.price,0);
  const note = document.getElementById('itemNote').value.trim();
  cart.push({uid:Date.now()+Math.random(),itemId:it.id,name:it.name,size:sz.n,addons:chosenAddons,note,qty:window._qty,unitPrice});
  window.closeModal();
  updateCartBar();
  showToast('تمت الإضافة للسلة ✓');
};

function updateCartBar(){
  const bar = document.getElementById('cartBar');
  if(viewOnlyMode || !cart.length){bar.classList.add('hidden');return;}
  bar.classList.remove('hidden');
  const count = cart.reduce((s,c)=>s+c.qty,0);
  const sub = cart.reduce((s,c)=>s+c.unitPrice*c.qty,0);
  document.getElementById('cartCount').textContent = count;
  document.getElementById('cartTotal').textContent = `${sub} ج.م`;
}

window.setOrderType = function(type){
  orderType = type;
  window.openCart();
};

    discount = appliedCoupon.type==='percent' ? Math.round(sub*(appliedCoupon.discount/100)) : Math.min(sub,appliedCoupon.discount);

  document.getElementById('modalContainer').innerHTML = `
    <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-end sm:items-center justify-center" onclick="if(event.target===this)window.closeModal()">

                ${c.addons.length?`<div class="text-[10px] text-[#a89f91]">+ ${c.addons.map(a=>sanitize(a.name)).join('، ')}</div>`:''}
                ${c.note?`<div class="text-[10px] text-amber-400">ملاحظة: ${sanitize(c.note)}</div>`:''}
                <div class="text-xs font-bold text-[#d49a5a] mt-0.5">${c.unitPrice*c.qty} ج.م</div>
              </div>
              <div class="flex items-center gap-2 bg-[#1c1a18] px-2 py-1 rounded-lg border border-[#352e27]">
                <button onclick="window.editCartQty(${idx},-1)" class="text-[#d49a5a] font-bold px-1">-</button>
                <span class="text-xs font-bold">${c.qty}</span>
                <button onclick="window.editCartQty(${idx},1)" class="text-[#d49a5a] font-bold px-1">+</button>
              </div>
            </div>`).join('')}
          </div>

          <div>
            <label class="text-xs font-bold text-[#d49a5a] block mb-2">طريقة الاستلام:</label>
            <div class="grid grid-cols-3 gap-1.5 bg-[#121110] p-1 rounded-xl border border-[#352e27]">
              <button onclick="window.setOrderType('dinein')" class="py-2 rounded-lg text-[11px] font-extrabold transition ${orderType==='dinein'?'brand-accent':'text-[#a89f91]'}">🍽️ داخل المطعم</button>
              <button onclick="window.setOrderType('pickup')" class="py-2 rounded-lg text-[11px] font-extrabold transition ${orderType==='pickup'?'brand-accent':'text-[#a89f91]'}">🛍️ تيك أواي</button>
              <button onclick="window.setOrderType('delivery')" class="py-2 rounded-lg text-[11px] font-extrabold transition ${orderType==='delivery'?'brand-accent':'text-[#a89f91]'}">🛵 دليفري</button>
            </div>
          </div>

          <div class="space-y-2.5">
            <div class="grid grid-cols-2 gap-2">
              <input id="cName" oninput="customerInfo.name=this.value" value="${sanitize(customerInfo.name)}" placeholder="الاسم الكريم *" class="bg-[#121110] border border-[#352e27] rounded-xl p-2.5 text-xs">
              <input id="cPhone" oninput="customerInfo.phone=this.value" value="${sanitize(customerInfo.phone)}" type="tel" placeholder="رقم الموبايل *" class="bg-[#121110] border border-[#352e27] rounded-xl p-2.5 text-xs">
            </div>
            ${orderType==='dinein'?`
              <input id="cTable" oninput="customerInfo.table=this.value" value="${sanitize(customerInfo.table)}" placeholder="رقم الطاولة إجباري *" class="w-full bg-[#121110] border border-[#d49a5a]/50 rounded-xl p-2.5 text-xs">
            `:''}
            ${orderType==='delivery'?`
              <select onchange="selectedZone=this.value;window.openCart()" class="w-full bg-[#121110] border border-[#352e27] rounded-xl p-2.5 text-xs text-[#f5f0e6]">
                ${state.zones.map(z=>`<option value="${z.id}" ${String(z.id)===String(zoneObj?.id)?'selected':''}>${sanitize(z.name)} (+${z.fee} ج.م)</option>`).join('')}
              </select>
              <div class="flex gap-2">
                <input id="cAddr" oninput="customerInfo.address=this.value" value="${sanitize(customerInfo.address)}" placeholder="العنوان بالتفصيل (شارع / عمارة / شقة) *" class="flex-1 bg-[#121110] border border-[#352e27] rounded-xl p-2.5 text-xs">
                <button onclick="window.getGPS()" type="button" class="px-3 rounded-xl bg-[#121110] border border-[#d49a5a]/40 text-[#d49a5a] text-xs font-bold flex items-center gap-1 whitespace-nowrap"><i data-lucide="locate-fixed" class="w-4 h-4"></i>GPS</button>
              </div>
              ${customerInfo.gps?`<div class="text-[10px] text-emerald-400">✓ تم إرفاق إحداثيات الموقع بنجاح</div>`:''}

          ${state.settings.couponsEnabled?`
            <div class="flex gap-2">
              <input id="couponInp" value="${appliedCoupon?sanitize(appliedCoupon.code):''}" placeholder="كود الخصم (جرب MEHA10)" class="flex-1 bg-[#121110] border border-[#352e27] rounded-xl p-2.5 text-xs uppercase">

            </div>
          `:''}

          <div>
            <label class="text-xs font-bold text-[#d49a5a] block mb-1.5">طريقة الدفع:</label>
            <div class="grid grid-cols-2 gap-2">
              <button onclick="customerInfo.payment='cash';window.openCart()" class="p-2.5 rounded-xl border text-xs font-bold ${customerInfo.payment==='cash'?'border-[#d49a5a] bg-[#d49a5a]/15':'border-[#352e27] bg-[#121110]'}">💵 كاش عند الاستلام</button>

window.editCartQty = function(idx,d){
  cart[idx].qty += d;
  if(cart[idx].qty<=0) cart.splice(idx,1);
  updateCartBar();
  if(!cart.length) window.closeModal(); else window.openCart();
};
window.applyCoupon = function(){
  const code = document.getElementById('couponInp').value.trim().toUpperCase();
  const found = state.coupons.find(c=>c.code.toUpperCase()===code);
  if(!found){showToast('كود الخصم غير صحيح');appliedCoupon=null;}else{appliedCoupon=found;showToast('تم تطبيق الخصم بنجاح!');}
  window.openCart();
};
window.getGPS = function(){
  if(!navigator.geolocation) return showToast('المتصفح لا يدعم تحديد الموقع');
  showToast('جاري تحديد موقعك...');
  navigator.geolocation.getCurrentPosition(pos=>{
    customerInfo.gps = `https://maps.google.com/?q=${pos.coords.latitude},${pos.coords.longitude}`;
    window.openCart();
    showToast('تم تحديد الموقع بنجاح ✓');
  },()=>showToast('تعذر الوصول للموقع، يرجى تفعيل GPS'));
};
window.sendWhatsAppOrder = function(sub,discount,delFee,grand){
  if(!customerInfo.name.trim() || !customerInfo.phone.trim()) return showToast('يرجى إدخال الاسم ورقم الموبايل');
  if(orderType==='dinein' && !customerInfo.table.trim()) return showToast('يرجى إدخال رقم الطاولة');
  if(orderType==='delivery' && !customerInfo.address.trim()) return showToast('يرجى إدخال عنوان التوصيل');

  const zoneObj = state.zones.find(z=>String(z.id)===String(selectedZone)) || state.zones[0];
  let typeLine = orderType==='dinein' ? `🍽️ داخل المطعم (صالة) - طاولة رقم: ${customerInfo.table}`
               : orderType==='pickup' ? `🛍️ استلام من الفرع (تيك أواي)`
               : `🛵 توصيل دليفري - المنطقة: ${zoneObj?.name||''}\n📍 العنوان: ${customerInfo.address}${customerInfo.gps?`\n🗺️ اللوكيشن: ${customerInfo.gps}`:''}`;

  const lines = cart.map((c,i)=>`${i+1}. ${c.name} (${c.size}) × ${c.qty} = ${c.unitPrice*c.qty} ج.م${c.addons.length?`\n   + إضافات: ${c.addons.map(a=>a.name).join('، ')}`:''}${c.note?`\n   📝 ملاحظة: ${c.note}`:''}`).join('\n');
  const msg = `*طلب جديد - ${state.settings.name}* 🔥\n━━━━━━━━━━━━━━\n*طريقة الاستلام:*\n${typeLine}\n\n*بيانات العميل:*\n👤 الاسم: ${customerInfo.name}\n📱 الهاتف: ${customerInfo.phone}\n💳 الدفع: ${customerInfo.payment==='cash'?'كاش':'إنستاباي / محفظة'}\n━━━━━━━━━━━━━━\n*الأصناف:*\n${lines}\n━━━━━━━━━━━━━━\nالمجموع: ${sub} ج.م${discount?`\nالخصم: -${discount} ج.م`:''}\nالتوصيل: ${delFee} ج.م\n*الإجمالي المطلوب: ${grand} ج.م*`;
  window.open(`https://wa.me/${state.settings.whatsapp}?text=${encodeURIComponent(msg)}`,'_blank');
};

window.copyText = function(txt){
  const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);
  showToast('تم النسخ للحافظة ✓');
};
window.shareMenu = async function(){
  const url = location.href;
  window.copyText(url);

};

        <input onchange="state.settings.address=this.value;saveState()" value="${sanitize(s.address)}" placeholder="العنوان" class="w-full bg-[#121110] border border-[#352e27] rounded-xl p-2 text-xs">
        <div class="grid grid-cols-2 gap-2">
          <input onchange="state.settings.phone=this.value;saveState()" value="${sanitize(s.phone)}" placeholder="الهاتف" class="bg-[#121110] border border-[#352e27] rounded-xl p-2 text-xs">
          <input onchange="state.settings.whatsapp=this.value;saveState()" value="${sanitize(s.whatsapp)}" placeholder="واتساب الطلبات (201...)" class="bg-[#121110] border border-[#352e27] rounded-xl p-2 text-xs">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <input type="time" onchange="state.settings.openTime=this.value;saveState()" value="${s.openTime}" class="bg-[#121110] border border-[#352e27] rounded-xl p-2 text-xs">

        </div>
        <input onchange="state.settings.instaPay=this.value;saveState()" value="${sanitize(s.instaPay)}" placeholder="حساب إنستاباي / محفظة" class="w-full bg-[#121110] border border-[#352e27] rounded-xl p-2 text-xs">
        <input onchange="state.settings.bannerUrl=this.value;saveState()" value="${sanitize(s.bannerUrl)}" placeholder="رابط صورة الغلاف (Banner URL)" class="w-full bg-[#121110] border border-[#352e27] rounded-xl p-2 text-xs">
        <div class="flex items-center justify-between text-[11px] text-[#a89f91] pt-1">
          <span>أو رفع صورة غلاف مباشرة:</span>

        <div class="grid grid-cols-3 gap-1.5">
          <input onchange="state.settings.facebook=this.value;saveState()" value="${sanitize(s.facebook)}" placeholder="رابط فيسبوك" class="bg-[#121110] border border-[#352e27] rounded-xl p-2 text-[11px]">
          <input onchange="state.settings.instagram=this.value;saveState()" value="${sanitize(s.instagram)}" placeholder="رابط انستجرام" class="bg-[#121110] border border-[#352e27] rounded-xl p-2 text-[11px]">
          <input onchange="state.settings.mapUrl=this.value;saveState()" value="${sanitize(s.mapUrl)}" placeholder="رابط الخريطة" class="bg-[#121110] border border-[#352e27] rounded-xl p-2 text-[11px]">
        </div>
      </div>
      <div class="flex justify-between items-center">
        <span class="text-xs font-bold text-[#d49a5a]">قائمة الأصناف (${state.items.length}):</span>
        <button onclick="window.addNewItem()" class="px-3 py-1.5 rounded-xl brand-accent text-xs font-black">+ صنف جديد</button>
      </div>
      <div class="space-y-2">
        ${state.items.map((it,idx)=>`<div class="p-2.5 rounded-xl bg-[#121110] border border-[#352e27] space-y-1.5">
          <div class="flex gap-2">
            <input onchange="state.items[${idx}].name=this.value;saveState()" value="${sanitize(it.name)}" class="flex-1 bg-[#1c1a18] border border-[#352e27] rounded-lg px-2 py-1 text-xs font-bold">
            <input onchange="state.items[${idx}].cat=this.value;saveState()" value="${sanitize(it.cat)}" class="w-28 bg-[#1c1a18] border border-[#352e27] rounded-lg px-2 py-1 text-[11px]">
            <button onclick="state.items.splice(${idx},1);saveState();reconcileCart();renderAdminPanel()" class="text-rose-400 px-1.5"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
          </div>
          <input onchange="state.items[${idx}].img=this.value;saveState()" value="${sanitize(it.img||'')}" placeholder="رابط صورة الصنف (Image URL)" class="w-full bg-[#1c1a18] border border-[#352e27] rounded-lg px-2 py-1 text-[11px]">
          <input onchange="window.updateItemSizes(${idx},this.value)" value="${it.sizes.map(x=>`${x.n}:${x.p}`).join(', ')}" placeholder="الأحجام مثل: فينو:14, بلدي:17" class="w-full bg-[#1c1a18] border border-[#352e27] rounded-lg px-2 py-1 text-[11px] text-[#d49a5a]">
        </div>`).join('')}
      </div>`;
  } else if(adminTab==='zones'){
    body = `
      <button onclick="state.zones.push({id:Date.now(),name:'منطقة جديدة',fee:20});saveState();renderAdminPanel()" class="w-full py-2.5 rounded-xl brand-accent text-xs font-black">+ إضافة منطقة توصيل</button>
      <div class="space-y-2">
        ${state.zones.map((z,i)=>`<div class="flex gap-2 items-center bg-[#121110] p-2.5 rounded-xl border border-[#352e27]">
          <input onchange="state.zones[${i}].name=this.value;saveState()" value="${sanitize(z.name)}" class="flex-1 bg-[#1c1a18] border border-[#352e27] rounded-lg p-1.5 text-xs">
          <input type="number" onchange="state.zones[${i}].fee=Number(this.value);saveState()" value="${z.fee}" class="w-20 bg-[#1c1a18] border border-[#352e27] rounded-lg p-1.5 text-xs text-center">
          <button onclick="state.zones.splice(${i},1);saveState();renderAdminPanel()" class="text-rose-400"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
        </div>`).join('')}
      </div>`;
  } else if(adminTab==='addons'){
    body = `
      <button onclick="state.addons.push({id:Date.now(),name:'إضافة جديدة',price:10});saveState();renderAdminPanel()" class="w-full py-2.5 rounded-xl brand-accent text-xs font-black">+ إضافة خيار جديد</button>
      <div class="space-y-2">
        ${state.addons.map((a,i)=>`<div class="flex gap-2 items-center bg-[#121110] p-2.5 rounded-xl border border-[#352e27]">
          <input onchange="state.addons[${i}].name=this.value;saveState()" value="${sanitize(a.name)}" class="flex-1 bg-[#1c1a18] border border-[#352e27] rounded-lg p-1.5 text-xs">
          <input type="number" onchange="state.addons[${i}].price=Number(this.value);saveState()" value="${a.price}" class="w-20 bg-[#1c1a18] border border-[#352e27] rounded-lg p-1.5 text-xs text-center">
          <button onclick="state.addons.splice(${i},1);saveState();renderAdminPanel()" class="text-rose-400"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
        </div>`).join('')}
      </div>`;
  } else if(adminTab==='coupons'){
    body = `
      <label class="flex items-center justify-between p-3 rounded-xl bg-[#121110] border border-[#352e27] text-xs font-bold">
        <span>تفعيل نظام كوبونات الخصم في السلة</span>
        <input type="checkbox" ${s.couponsEnabled?'checked':''} onchange="state.settings.couponsEnabled=this.checked;saveState()" class="accent-[#d49a5a] w-4 h-4">
      </label>
      <button onclick="state.coupons.push({code:'SAVE15',discount:15,type:'percent'});saveState();renderAdminPanel()" class="w-full py-2.5 rounded-xl brand-accent text-xs font-black">+ إضافة كوبون جديد</button>
      <div class="space-y-2">
        ${state.coupons.map((c,i)=>`<div class="flex gap-2 items-center bg-[#121110] p-2.5 rounded-xl border border-[#352e27]">
          <input onchange="state.coupons[${i}].code=this.value.toUpperCase();saveState()" value="${sanitize(c.code)}" class="flex-1 bg-[#1c1a18] border border-[#352e27] rounded-lg p-1.5 text-xs uppercase font-bold">
          <input type="number" onchange="state.coupons[${i}].discount=Number(this.value);saveState()" value="${c.discount}" class="w-16 bg-[#1c1a18] border border-[#352e27] rounded-lg p-1.5 text-xs text-center">
          <select onchange="state.coupons[${i}].type=this.value;saveState()" class="bg-[#1c1a18] border border-[#352e27] rounded-lg p-1.5 text-xs">
            <option value="percent" ${c.type==='percent'?'selected':''}>%</option>
            <option value="fixed" ${c.type==='fixed'?'selected':''}>ج.م</option>
          </select>
          <button onclick="state.coupons.splice(${i},1);saveState();renderAdminPanel()" class="text-rose-400"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
        </div>`).join('')}
      </div>`;
  } else if(adminTab==='sync'){
    body = `
      <div class="grid grid-cols-2 gap-2">
        <button onclick="window.exportExcel()" class="p-3 rounded-xl bg-emerald-700/30 border border-emerald-500/40 text-emerald-300 text-xs font-bold">📥 تصدير Excel</button>
        <label class="p-3 rounded-xl bg-sky-700/30 border border-sky-500/40 text-sky-300 text-xs font-bold text-center cursor-pointer">📤 استيراد Excel<input type="file" accept=".xlsx,.xls" onchange="window.importExcel(this)" class="hidden"></label>
      </div>
      <div class="p-3 rounded-2xl bg-[#121110] border border-[#352e27] space-y-2">
        <div class="text-xs font-bold text-[#d49a5a]">مزامنة Google Sheets السحابية:</div>
        <input id="gsUrl" placeholder="ضع رابط Google Sheet العام هنا..." class="w-full bg-[#1c1a18] border border-[#352e27] rounded-xl p-2 text-xs">
        <button onclick="window.syncGoogleSheet()" class="w-full py-2 rounded-xl bg-[#2a2520] text-[#d49a5a] text-xs font-bold border border-[#d49a5a]/30">🔄 مزامنة الآن</button>
      </div>
      <button onclick="window.exportHtml()" class="w-full py-3 rounded-xl brand-accent text-xs font-black">💾 تصدير نسخة الكود المحدثة (index.html)</button>
      <button onclick="if(confirm('إعادة ضبط المصنع؟')){localStorage.removeItem(STORAGE_KEY);location.reload();}" class="w-full py-2.5 rounded-xl bg-rose-950/50 border border-rose-500/30 text-rose-300 text-xs font-bold">⚠️ إعادة ضبط المصنع</button>
      <div class="p-3 rounded-2xl bg-[#121110] border border-[#352e27] space-y-2 mt-2">
        <div class="text-[11px] font-bold text-[#a89f91]">قسم ترخيص الدعم الفني — مَنظومة تك:</div>
        ${!s.licenseUnlocked?`
          <div class="flex gap-2">
            <input id="licCode" type="password" placeholder="أدخل كود الترخيص السري..." class="flex-1 bg-[#1c1a18] border border-[#352e27] rounded-xl p-2 text-xs">
            <button onclick="window.unlockLicense()" class="px-3 rounded-xl bg-[#d49a5a] text-[#121110] text-xs font-black">تفعيل</button>
          </div>
        `:`
          <div class="flex items-center justify-between text-xs">
            <span>وضع التشغيل الحالي:</span>
            <button onclick="viewOnlyMode=!viewOnlyMode;updateCartBar();renderMenu();renderAdminPanel()" class="px-3 py-1.5 rounded-xl brand-accent font-black">${viewOnlyMode?'التبديل إلى Pro':'التبديل إلى العرض الذكي'}</button>
          </div>
        `}
      </div>`;
  }

  document.getElementById('modalContainer').innerHTML = `
    <div class="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm flex items-end sm:items-center justify-center">
      <div class="w-full max-w-[480px] bg-[#1c1a18] border border-[#352e27] rounded-t-3xl sm:rounded-3xl h-[90vh] flex flex-col overflow-hidden">
        <div class="p-4 border-b border-[#352e27] flex justify-between items-center flex-shrink-0">
          <h3 class="font-black text-sm text-[#d49a5a]">لوحة تحكم ${sanitize(s.name)}</h3>
          <button onclick="window.closeModal();renderHeaderAndFooter();renderCategories();renderMenu();updateCartBar()" class="px-3 py-1 rounded-xl bg-[#121110] text-xs text-[#f5f0e6] border border-[#352e27]">حفظ وإغلاق ✓</button>
        </div>
        <div class="flex gap-1.5 overflow-x-auto no-scrollbar p-3 border-b border-[#352e27] flex-shrink-0 bg-[#161412]">
          ${tabs.map(t=>`<button onclick="window.setAdminTab('${t.id}')" class="px-3 py-1.5 rounded-xl text-[11px] font-bold whitespace-nowrap ${adminTab===t.id?'brand-accent':'bg-[#121110] text-[#a89f91]'}">${t.n}</button>`).join('')}
        </div>
        <div class="p-4 overflow-y-auto flex-1 min-h-0 space-y-3">${body}</div>
      </div>
    </div>`;
  lucide.createIcons();
}

window.addNewItem = function(){
  state.items.unshift({id:Date.now(),cat:'أصناف جديدة',name:'صنف جديد',desc:'',sizes:[{n:'عادي',p:30}],img:''});
  saveState();renderAdminPanel();
};
window.updateItemSizes = function(idx,str){
  const parts = str.split(',').map(p=>{const [n,pr]=p.split(':');return n&&pr?{n:n.trim(),p:Number(pr.trim())||0}:null;}).filter(Boolean);
  if(parts.length){state.items[idx].sizes=parts;saveState();}
};
window.uploadCompressedImg = function(inp,field){
  const file = inp.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas');
      const scale = Math.min(1, 800/img.width);
      c.width = img.width*scale; c.height = img.height*scale;
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      state.settings[field] = c.toDataURL('image/jpeg',0.75);
      saveState(); showToast('تم رفع وضغط الصورة ✓');
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
};
window.unlockLicense = function(){
  if(document.getElementById('licCode').value.trim()==='MT-PRO-2026'){
    state.settings.licenseUnlocked = true; saveState(); renderAdminPanel(); showToast('تم تفعيل لوحة الترخيص ✓');
  }else{showToast('كود الترخيص غير صحيح');}
};

window.exportExcel = function(){
  const wb = XLSX.utils.book_new();
  const menuRows = state.items.map(i=>({'القسم':i.cat,'الصنف':i.name,'الوصف':i.desc,'الأسعار':i.sizes.map(s=>`${s.n}:${s.p}`).join(', '),'رابط الصورة':i.img||''}));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(menuRows), 'المنيو');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(state.zones.map(z=>({'المنطقة':z.name,'الرسوم':z.fee}))), 'مناطق التوصيل');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(state.addons.map(a=>({'الإضافة':a.name,'السعر':a.price}))), 'الإضافات');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet([state.settings]), 'الإعدادات');
  XLSX.writeFile(wb, 'manzouma_menu_kebdaki_meha.xlsx');
};
window.importExcel = function(inp){
  const f = inp.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = e => {
    const wb = XLSX.read(e.target.result,{type:'array'});
    const mSheet = wb.Sheets['المنيو'];
    if(mSheet){
      const rows = XLSX.utils.sheet_to_json(mSheet);
      if(rows.length){
        state.items = rows.map((row,i)=>({
          id:Date.now()+i,
          cat:row['القسم']||'عام',
          name:row['الصنف']||'صنف',
          desc:row['الوصف']||'',
          img:row['رابط الصورة']||'',
          sizes:String(row['الأسعار']||'عادي:20').split(',').map(s=>{const [n,p]=s.split(':');return {n:(n||'عادي').trim(),p:Number(p)||0};})
        }));
      }
    }
    const zSheet = wb.Sheets['مناطق التوصيل'];
    if(zSheet){const zr=XLSX.utils.sheet_to_json(zSheet);if(zr.length) state.zones=zr.map((z,i)=>({id:i+1,name:z['المنطقة'],fee:Number(z['الرسوم'])||0}));}
    const aSheet = wb.Sheets['الإضافات'];
    if(aSheet){const ar=XLSX.utils.sheet_to_json(aSheet);if(ar.length) state.addons=ar.map((a,i)=>({id:i+1,name:a['الإضافة'],price:Number(a['السعر'])||0}));}
    saveState(); reconcileCart(); renderAdminPanel(); showToast('تم استيراد البيانات بنجاح ✓');
  };
  r.readAsArrayBuffer(f);
};
window.syncGoogleSheet = async function(){
  const rawUrl = document.getElementById('gsUrl').value.trim();
  const m = rawUrl.match(/\/d\/([a-zA-Z0-9-_]+)/);
  if(!m) return showToast('رابط Google Sheet غير صالح');
  const exportUrl = `https://docs.google.com/spreadsheets/d/${m[1]}/export?format=xlsx`;
  const ctrl = new AbortController(); setTimeout(()=>ctrl.abort(),6000);
  try{
    let res = await fetch(exportUrl,{signal:ctrl.signal});
    if(!res.ok) res = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(exportUrl)}`);
    const buf = await res.arrayBuffer();
    const wb = XLSX.read(buf,{type:'array'});
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
    if(rows.length){
      state.items = rows.map((row,i)=>({
        id:Date.now()+i,cat:row['القسم']||'عام',name:row['الصنف']||'صنف',desc:row['الوصف']||'',img:row['رابط الصورة']||'',
        sizes:String(row['الأسعار']||'عادي:20').split(',').map(s=>{const [n,p]=s.split(':');return {n:(n||'عادي').trim(),p:Number(p)||0};})
      }));
      saveState(); reconcileCart(); renderAdminPanel(); showToast('تمت المزامنة السحابية ✓');
    }
  }catch(e){showToast('تعذر الاتصال بالشيت، تأكد أنه عام (Public)');}
};
window.exportHtml = function(){
  const html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([html],{type:'text/html'}));
  a.download = 'index.html'; a.click();
};

renderHeaderAndFooter();
renderCategories();
renderMenu();
updateCartBar();
</script>
</body>
